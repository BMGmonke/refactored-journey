<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sonic 2 Asset Viewer</title>
<style>
body{background:#101522;color:white;font-family:monospace;padding:16px}
canvas{width:100%;max-width:768px;image-rendering:pixelated;background:#222}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<h2>Sonic 2 — Asset Viewer</h2>
<p id="status">Loading Sonic assets...</p>
<canvas id="tiles"></canvas>
<h3>Sprite mappings</h3>
<pre id="mapping">Loading...</pre>
<script>
const base="https://cdn.jsdelivr.net/gh/BMGmonke/refactored-journey@main/";
const files={
 art:"art/uncompressed/Sonic%27s%20art.bin",
 palette:"art/palettes/SonicAndTails.bin",
 mapping:"mappings/sprite/Sonic.asm",
 dplc:"mappings/spriteDPLC/Sonic.asm",
 collisionH:"collision/Collision%20array%20-%20Horizontal.bin",
 collisionV:"collision/Collision%20array%20-%20Vertical.bin",
 physics:"collision/Curve%20and%20resistance%20mapping.bin",
 angles:"misc/angles.bin",
 sine:"misc/sinewave.bin"
};
async function load(path){
 const r=await fetch(base+path);
 if(!r.ok)throw Error(path+" — HTTP "+r.status);
 return r;
}
async function start(){
 try{
  const [art,pal,map]=await Promise.all([
   load(files.art).then(r=>r.arrayBuffer()),
   load(files.palette).then(r=>r.arrayBuffer()),
   load(files.mapping).then(r=>r.text())
  ]);
  const bytes=new Uint8Array(art);
  const paletteBytes=new DataView(pal);
  const colors=[];
  for(let i=0;i<16;i++){
   const v=paletteBytes.getUint16(i*2,false);
   const r=((v>>1)&7)*255/7;
   const g=((v>>5)&7)*255/7;
   const b=((v>>9)&7)*255/7;
   colors.push(`rgb(${r},${g},${b})`);
  }
  const tileCount=Math.floor(bytes.length/32);
  const cols=32, rows=Math.ceil(tileCount/cols);
  const canvas=document.querySelector("#tiles");
  canvas.width=cols*8;canvas.height=rows*8;
  const ctx=canvas.getContext("2d");
  const img=ctx.createImageData(canvas.width,canvas.height);
  for(let t=0;t<tileCount;t++){
   for(let y=0;y<8;y++){
    for(let x=0;x<8;x++){
     const byte=bytes[t*32+y*4+(x>>1)];
     const n=(x&1)?byte&15:byte>>4;
     const v=paletteBytes.getUint16(n*2,false);
     const r=Math.round(((v>>1)&7)*255/7);
     const g=Math.round(((v>>5)&7)*255/7);
     const b=Math.round(((v>>9)&7)*255/7);
     const px=(Math.floor(t/cols)*8+y)*canvas.width+(t%cols)*8+x;
     img.data.set([r,g,b,n?255:0],px*4);
    }
   }
  }
  ctx.putImageData(img,0,0);
  document.querySelector("#mapping").textContent=map.slice(0,12000);
  document.querySelector("#status").textContent=
   `Loaded ${bytes.length.toLocaleString()} art bytes, ${tileCount} tiles, palette and Sonic mappings.`;
 }catch(e){
  document.querySelector("#status").textContent="Load failed: "+e;
 }
}
start();
</script>
</body>
</html>
